<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | default: site.description }}">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script defer src="{{ '/assets/js/main.js' | relative_url }}"></script>
  {% if site.plausible_domain %}
  <script defer data-domain="{{ site.plausible_domain }}" src="https://plausible.io/js/script.js"></script>
  {% endif %}
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="site">
    <header class="site-header">
      <div class="brand">
        <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <small>{{ site.description }}</small>
      </div>
      <div class="header-actions">
        <nav>
          <a href="{{ '/' | relative_url }}">홈</a>
          &nbsp;·&nbsp;
          <a href="{{ '/categories/' | relative_url }}">카테고리</a>
          &nbsp;·&nbsp;
          <a href="{{ site.github.repository_url | default: 'https://github.com' }}">GitHub</a>
        </nav>
        <div class="header-search">
          <input id="q" type="search" placeholder="Search..." aria-label="Search"/>
          <div id="search-results" class="card" style="display:none" role="region" aria-live="polite" aria-label="검색 결과"></div>
        </div>
        <button type="button" id="theme-toggle" aria-label="Toggle dark mode">🌓</button>
      </div>
    </header>

    <aside class="left">
      {% include sidebar-left.html %}
    </aside>

    <main id="content">
      {{ content }}
    </main>

    <aside class="right">
      {% include sidebar-right.html %}
    </aside>

    <footer>
      © {{ site.time | date: "%Y" }} · {{ site.title }} — GitHub Pages & Jekyll
    </footer>
  </div>
  <script>
    (function(){
      const root = document.documentElement;
      const toggle = document.getElementById('theme-toggle');
      const setTheme = (next, persist = true) => {
        root.dataset.theme = next;
        if(persist){ localStorage.setItem('theme', next); }
        toggle?.setAttribute('aria-pressed', next === 'dark');
        const frame = document.querySelector('iframe.giscus-frame');
        frame?.contentWindow?.postMessage({ giscus: { setConfig: { theme: next === 'dark' ? 'dark' : 'light' } } }, 'https://giscus.app');
      };
      const saved = localStorage.getItem('theme');
      if(saved){
        setTheme(saved, false);
      }else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){
        setTheme('dark', false);
      }else{
        root.dataset.theme = root.dataset.theme || 'light';
        toggle?.setAttribute('aria-pressed', false);
      }
      toggle?.addEventListener('click', () => {
        const current = root.dataset.theme === 'dark' ? 'dark' : 'light';
        const next = current === 'dark' ? 'light' : 'dark';
        setTheme(next);
      });
      if('MutationObserver' in window){
        const observer = new MutationObserver(() => {
          const frame = document.querySelector('iframe.giscus-frame');
          if(frame){
            setTheme(root.dataset.theme === 'dark' ? 'dark' : 'light', false);
            observer.disconnect();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script defer src="{{ '/assets/js/search.js' | relative_url }}"></script>
</body>
</html>

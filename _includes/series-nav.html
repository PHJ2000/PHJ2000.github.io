{% if page.series %}
  {% assign siblings = site.posts | where:"series", page.series | sort: "date" %}
  <div class="card" style="margin-top:16px">
    <h3 style="margin-top:0">시리즈: {{ page.series }}</h3>
    <ol>
      {% for s in siblings %}
      <li{% if s.url == page.url %} style="font-weight:700"{% endif %}>
        <a href="{{ s.url | relative_url }}">{{ s.title }}</a>
      </li>
      {% endfor %}
    </ol>
  </div>
{% endif %}
